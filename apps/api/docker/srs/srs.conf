# SRS media server for streamy: accepts rtmp publishes, delegates hls
# transcoding to the process node via the http hooks (the api queues the
# live process job on on_publish and marks the video inactive on unpublish)
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         off;
}

vhost __defaultVhost__ {
    hls {
        enabled     off;
    }
    http_hooks {
        enabled         on;
        on_publish      http://app:3000/api/v1/live/on_publish;
        on_unpublish    http://app:3000/api/v1/live/on_unpublish;
    }
}
