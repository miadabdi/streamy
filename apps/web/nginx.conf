# Static SPA (vite dist) + reverse proxies for the same-origin backends.
# Paths mirror the vite dev proxy (vite.config.ts) so dev and prod agree.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	# docker's embedded DNS. Upstreams are referenced through variables so
	# names resolve at REQUEST time, not at config load — nginx must boot
	# (and serve the SPA) even when a backend isn't up yet; an unresolved
	# name is then just a 502 on that path, not a dead container.
	resolver 127.0.0.11 valid=10s ipv6=off;

	gzip on;
	gzip_comp_level 5;
	# below gzip_min_length only hurts; html is always gzipped when gzip is on
	gzip_min_length 256;
	gzip_vary on;
	gzip_types
		application/javascript
		application/json
		application/vnd.apple.mpegurl
		image/svg+xml
		text/css
		text/plain;

	server {
		listen 80;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;

		# vite emits content-hashed assets here
		location /assets/ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			try_files $uri =404;
		}

		# runtime config — re-rendered by the entrypoint on every start
		location = /env.js {
			add_header Cache-Control "no-store";
		}

		# SeaweedFS S3 reads the bucket from the first path segment, so the
		# /storage prefix must be stripped (same as the vite rewrite; do not
		# "fix" this). set must precede the rewrite: `break` stops all
		# rewrite-module directives, including set.
		location /storage/ {
			set $storage_upstream seaweedfs:8333;
			rewrite ^/storage/(.*)$ /$1 break;
			proxy_pass http://$storage_upstream;
			proxy_set_header Host $host;
		}

		# ops console health calls — the worker's own routes are /api/v1/…,
		# so strip the /worker-api prefix the same way /storage does
		location /worker-api/ {
			set $worker_upstream process_node:3001;
			rewrite ^/worker-api/(.*)$ /$1 break;
			proxy_pass http://$worker_upstream;
			proxy_set_header Host $host;
		}

		location /api/ {
			set $api_upstream app:3000;
			proxy_pass http://$api_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			# uploads and processing-triggering calls are slow; nginx's 60s
			# default would cut them off
			proxy_read_timeout 10m;
			proxy_send_timeout 10m;
			# video binaries never transit /api (they go straight to storage
			# via presigned PUTs) but thumbnails/subtitles/avatars are
			# multipart-posted through here — don't clip them at nginx's 1m
			client_max_body_size 0;
		}

		# SPA history fallback
		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
