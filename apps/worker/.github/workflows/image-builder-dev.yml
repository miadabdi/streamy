name: Build and Push Docker Image Dev

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  docker_build_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requires DOCKER_USERNAME and DOCKER_PASSWORD secrets on this repo
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/streamy_process_node:dev-latest
            ${{ secrets.DOCKER_USERNAME }}/streamy_process_node:dev-${{ github.sha }}
