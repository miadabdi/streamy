<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Streamy — thumbnail</title>
<link rel="stylesheet" href="styles.css" />
<style>
html, body { height: 100%; }
body { margin: 0; display: flex; background: var(--color-accent); }
.mark { flex: 1; display: grid; place-items: center; overflow: hidden; }
.mark h1 { margin: 0; display: inline-flex; align-items: center; color: var(--color-on-accent); font-family: var(--font-mono); font-weight: 700; font-size: 118px; letter-spacing: 0.2em; white-space: nowrap; }
.mark h1 i { width: 26px; height: 26px; border-radius: 50%; background: var(--color-on-accent); margin-left: -0.12em; }
.strip { width: 25%; display: flex; flex-direction: column; }
.strip i { flex: 1; }
</style>
</head>
<body>
<div class="mark"><h1>STREAMY<i></i></h1></div>
<aside class="strip"><i style="background: var(--color-accent-200)"></i><i style="background: var(--color-warn)"></i><i style="background: var(--color-ok)"></i><i style="background: var(--color-accent-700)"></i></aside>
</body>
</html>
