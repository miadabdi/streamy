name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint -w apps/${{ matrix.app }}

      # vitest transforms without type-checking; this catches spec type errors
      - run: npx tsc --noEmit -p apps/${{ matrix.app }}/tsconfig.json

      # web uses vite's solution-style tsconfig (no files), so tsc -p passes
      # vacuously; build its referenced projects instead
      - run: npx tsc -b apps/web
        if: matrix.app == 'web'

      - run: npm test -w apps/${{ matrix.app }}

  # the worker dockerfile compiles ffmpeg from source; this keeps it honest
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          target: production
          push: false
          tags: streamy-process-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
